# This GitHub Actions workflow automatically builds Docker images when Dockerfiles are modified.
#
# Workflow Name: build-docker-auto
# Short Description: Build Docker images for each modified Dockerfile
#
# Triggers:
# - On push events to branches containing "autobuild" in the name, if any Dockerfile.* is modified.
# - On pull request events to 'main' and 'dev' branches, if any Dockerfile.* is modified.
#
# Jobs:
#   1. get-files: Detects changed Dockerfiles across the event range.
#      - Initial branch pushes use the first pushed commit's parent as the diff base.
#      - Other pushes and pull requests use the changed-files action.
#   2. build-docker: For each changed Dockerfile, builds and optionally pushes the Docker image using the build-docker action.
#
# Notes:
# - Initial pushes have an all-zero `before` SHA, so changed Dockerfiles are collected from git
#   history instead of calling the compare API with an invalid SHA.
# - The workflow is fork-safe: both get-files and build-docker steps work on fork pull requests.
# - Dockerfiles can opt into additional architectures with a `# build-platforms:` comment.
# - PR synchronize events only build when the new commit range changes a Dockerfile.
# - New PR builds cancel stale builds for the same Dockerfile; other PRs and pushes are unaffected.

name: build-docker-auto

permissions:
  contents: write
  pull-requests: write
  packages: write

on:
  push:
    branches:
      - "**autobuild**" # Only trigger if the branch name contains "autobuild"
    paths:
      - "**/Dockerfile.*" # Only trigger if a Dockerfile.* is modified in any directory

  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**/Dockerfile.*" # Only trigger if a Dockerfile.* is modified in any directory
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review # Ensures the workflow triggers only when a draft is marked "Ready for Review"

env:
  suffix:
    ${{ github.base_ref == 'main' && github.event_name == 'pull_request' &&
    'main' || github.base_ref == 'dev' && github.event_name == 'pull_request' &&
    'dev' || 'feat' }}

jobs:
  get-files:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.select-files.outputs.json }}
    steps:
      - name: Checkout initial push history
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find Dockerfiles in initial push
        id: initial-push
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        env:
          FIRST_PUSH_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          set -euo pipefail

          if [[ -z "$FIRST_PUSH_COMMIT" ]]; then
            echo "::error::Initial push event did not include any commits."
            exit 1
          fi

          parents="$(git rev-list --parents -n 1 "$FIRST_PUSH_COMMIT")"
          read -r _ base_sha _ <<< "$parents"
          if [[ -n "${base_sha:-}" ]]; then
            changed_files="$(git diff --name-only --diff-filter=ACMRT "$base_sha" "$GITHUB_SHA")"
          else
            changed_files="$(git ls-tree --name-only -r "$GITHUB_SHA")"
          fi

          matched_files_json="$(printf '%s\n' "$changed_files" | python3 -c '
          import json
          import sys

          files = [
              path for path in sys.stdin.read().splitlines()
              if path.rsplit("/", 1)[-1].startswith("Dockerfile.")
          ]
          print(json.dumps(files))
          ')"

          echo "matched_files_json=$matched_files_json" >> "$GITHUB_OUTPUT"
          echo "Matched Dockerfiles: $matched_files_json"

      - id: synchronize-files
        name: Check Dockerfiles changed in PR update
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" || -z "$AFTER_SHA" || -z "$HEAD_REPOSITORY" ]]; then
            echo "::error::Pull request synchronize event is missing its before/after commit or head repository."
            exit 1
          fi

          changed_files="$(gh api \
            "repos/${HEAD_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
            --jq '.files[]?.filename | select(test("(^|/)Dockerfile\\."))')"
          matched_files_json="$(printf '%s\n' "$changed_files" | python3 -c '
          import json
          import sys

          print(json.dumps(sys.stdin.read().splitlines()))
          ')"

          echo "matched_files_json=$matched_files_json" >> "$GITHUB_OUTPUT"
          echo "Dockerfiles changed in PR update: $matched_files_json"

      - id: changed-files
        name: Check changed files
        if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
        uses: CCBR/actions/changed-files@v0.9.0
        with:
          token: ${{ github.token }}
          paths: |
            **/Dockerfile.*
          comparison-mode: event

      - name: Select Dockerfiles to build
        id: select-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INITIAL_PUSH_FILES_JSON: ${{ steps.initial-push.outputs.matched_files_json }}
          SYNCHRONIZE_FILES_JSON: ${{ steps.synchronize-files.outputs.matched_files_json }}
          EVENT_FILES_JSON: ${{ steps.changed-files.outputs.matched_files_json }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" &&
                "$EVENT_ACTION" == "synchronize" &&
                "$SYNCHRONIZE_FILES_JSON" == "[]" ]]; then
            selected_files_json="[]"
          else
            selected_files_json="${INITIAL_PUSH_FILES_JSON:-$EVENT_FILES_JSON}"
          fi
          echo "json=$selected_files_json" >> "$GITHUB_OUTPUT"
          echo "Selected Dockerfiles: $selected_files_json"

  build-docker:
    needs: [get-files]
    if: needs.get-files.outputs.json != '[]' # Skip if no Dockerfiles changed in the event range
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.file }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        file: "${{ fromJson(needs.get-files.outputs.json) }}"
      max-parallel: 8
      fail-fast: false
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Determine Docker build platforms
        id: platforms
        env:
          DOCKERFILE_PATH: ${{ matrix.file }}
        run: |
          set -euo pipefail

          dockerfile="$GITHUB_WORKSPACE/$DOCKERFILE_PATH"
          declarations="$(grep -E '^[[:space:]]*#[[:space:]]*build-platforms:' "$dockerfile" || true)"
          if [[ -z "$declarations" ]]; then
            platforms="linux/amd64"
          else
            declaration_count="$(printf '%s\n' "$declarations" | wc -l | tr -d ' ')"
            if [[ "$declaration_count" != "1" ]]; then
              echo "::error::$dockerfile must contain at most one build-platforms declaration."
              exit 1
            fi

            platforms="${declarations#*:}"
            platforms="${platforms//[[:space:]]/}"
            if [[ -z "$platforms" ]]; then
              echo "::error::The build-platforms declaration in $dockerfile is empty."
              exit 1
            fi

            if [[ ! "$platforms" =~ ^linux/(amd64|arm64)(,linux/(amd64|arm64))*$ ]]; then
              echo "::error::Malformed or unsupported build-platforms declaration in $dockerfile: $platforms. Supported platforms are linux/amd64 and linux/arm64."
              exit 1
            fi

            IFS=',' read -r -a platform_list <<< "$platforms"
            seen_platforms=","
            for platform in "${platform_list[@]}"; do
              if [[ "$seen_platforms" == *",$platform,"* ]]; then
                echo "::error::Duplicate platform '$platform' in $dockerfile."
                exit 1
              fi
              seen_platforms+="$platform,"
            done

            platforms="$(IFS=,; echo "${platform_list[*]}")"
          fi

          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Building $dockerfile for: $platforms"

      - uses: CCBR/actions/build-docker@v0.9.0
        with:
          dockerfile: ${{ matrix.file }}
          dockerhub-namespace: nciccbr
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          dockerhub-token: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          # Fork PR tokens cannot write packages.
          registries: ${{ github.event.pull_request.head.repo.fork && 'dockerhub' || 'dockerhub,ghcr' }}
          suffix: ${{ env.suffix }}
          push: true
          platforms: ${{ steps.platforms.outputs.platforms }}
          github-token: ${{ github.token }}
