# This GitHub Actions workflow automatically builds Docker images when Dockerfiles are modified.
#
# Workflow Name: build-docker-auto
# Short Description: Build Docker images for each modified Dockerfile
#
# Triggers:
# - On pushes to main or branches containing "autobuild" that change a Dockerfile or its source metadata.
# - On pull requests to main that change a Dockerfile or its source metadata.
#
# Jobs:
#   1. get-files: Detects changed Dockerfiles across the event range.
#      - Initial branch pushes use the first pushed commit's parent as the diff base.
#      - Other pushes and pull requests use the changed-files action.
#   2. build-docker: For each changed Dockerfile, builds and optionally pushes the Docker image using the build-docker action.
#
# Notes:
# - Initial pushes have an all-zero `before` SHA, so changed Dockerfiles are collected from git
#   history instead of calling the compare API with an invalid SHA.
# - Fork pull requests build images without publishing them.
# - Dockerfiles can opt into additional architectures with a `# build-platforms:` comment.

name: build-docker-auto

permissions:
  contents: write
  pull-requests: write
  packages: write

on:
  push:
    branches:
      - main
      - "**autobuild**"
    paths:
      - "**/Dockerfile.*"
      - "**/.Dockerfile.*.source.json"

  pull_request:
    branches:
      - main
    paths:
      - "**/Dockerfile.*"
      - "**/.Dockerfile.*.source.json"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review # Ensures the workflow triggers only when a draft is marked "Ready for Review"

jobs:
  get-files:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.existing-files.outputs.matched_files_json }}
    steps:
      - name: Checkout event source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find Dockerfiles in initial push
        id: initial-push
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        env:
          FIRST_PUSH_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          set -euo pipefail

          if [[ -z "$FIRST_PUSH_COMMIT" ]]; then
            echo "::error::Initial push event did not include any commits."
            exit 1
          fi

          parents="$(git rev-list --parents -n 1 "$FIRST_PUSH_COMMIT")"
          read -r _ base_sha _ <<< "$parents"
          if [[ -n "${base_sha:-}" ]]; then
            changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          else
            changed_files="$(git ls-tree --name-only -r "$GITHUB_SHA")"
          fi

          matched_files_json="$(printf '%s\n' "$changed_files" | python3 -c '
          import json
          import sys

          files = []
          for path in sys.stdin.read().splitlines():
              name = path.rsplit("/", 1)[-1]
              if name.startswith("Dockerfile.") or (
                  name.startswith(".Dockerfile.") and name.endswith(".source.json")
              ):
                  files.append(path)
          print(json.dumps(files))
          ')"

          echo "matched_files_json=$matched_files_json" >> "$GITHUB_OUTPUT"
          echo "Matched Dockerfiles: $matched_files_json"

      - id: changed-files
        name: Check changed files
        if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
        uses: CCBR/actions/changed-files@v0.9.0
        with:
          token: ${{ github.token }}
          paths: |
            **/Dockerfile.*
            **/.Dockerfile.*.source.json
          comparison-mode: event

      - name: Exclude deleted Dockerfiles
        id: existing-files
        env:
          MATCHED_FILES_JSON: ${{ steps.initial-push.outputs.matched_files_json || steps.changed-files.outputs.matched_files_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["MATCHED_FILES_JSON"])
          existing = []
          seen = set()
          for file in files:
              path = Path(file)
              if path.name.startswith(".Dockerfile.") and path.name.endswith(".source.json"):
                  dockerfile = path.with_name(path.name[1:-len(".source.json")])
                  if not path.is_file() and dockerfile.is_file():
                      print(f"::warning::Source metadata was removed: {path}")
              else:
                  dockerfile = path
              name = dockerfile.as_posix()
              if dockerfile.is_file() and name not in seen:
                  existing.append(name)
                  seen.add(name)
              elif not dockerfile.is_file():
                  print(f"::notice::Skipping deleted Dockerfile: {name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matched_files_json={json.dumps(existing)}", file=output)
          PY

      - name: Show changed files
        id: matrix
        env:
          MATCHED_FILES_JSON: ${{ steps.existing-files.outputs.matched_files_json }}
        run: |
          echo "Matched Dockerfiles: $MATCHED_FILES_JSON"

  build-docker:
    needs: [ get-files ]
    if: needs.get-files.outputs.json != '[]' # Skip if no Dockerfiles changed in the event range
    strategy:
      matrix:
        file: "${{ fromJson(needs.get-files.outputs.json) }}"
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare checked-out branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: git switch --create "$BRANCH_NAME"

      - name: Determine image publication
        id: build-policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT_NAME" in
            push)
              push=true
              if [[ "$EVENT_REF" == "refs/heads/main" ]]; then
                suffix=main
              else
                suffix=dev
              fi
              ;;
            pull_request)
              if [[ -z "$PR_HEAD_REPOSITORY" ]]; then
                echo "::error::Pull request head repository is unavailable."
                exit 1
              fi
              suffix=dev
              if [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                push=true
              else
                push=false
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Check workflow checkout location
        if: github.event_name == 'pull_request'
        run: |
          workflow_checkout="$GITHUB_WORKSPACE/.ccbr-workflow-source"
          if [[ -e "$workflow_checkout" || -L "$workflow_checkout" ]]; then
            echo "::error::Reserved workflow checkout path already exists: $workflow_checkout"
            exit 1
          fi

      - name: Checkout workflow action
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ccbr-workflow-source
          sparse-checkout: .github/actions/restore-docker-context
          persist-credentials: false

      - name: Restore source context for pull requests
        if: github.event_name == 'pull_request'
        uses: ./.ccbr-workflow-source/.github/actions/restore-docker-context
        with:
          dockerfile: ${{ matrix.file }}

      - name: Restore source context for pushes
        if: github.event_name == 'push'
        uses: ./.github/actions/restore-docker-context
        with:
          dockerfile: ${{ matrix.file }}

      - name: Move workflow checkout out of the build context
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          helper_dir="$(mktemp -d "$RUNNER_TEMP/ccbr-workflow.XXXXXX")"
          mv "$GITHUB_WORKSPACE/.ccbr-workflow-source" "$helper_dir/checkout"

      - name: Determine Docker build platforms
        id: platforms
        env:
          DOCKERFILE_PATH: ${{ matrix.file }}
        run: |
          set -euo pipefail

          dockerfile="$GITHUB_WORKSPACE/$DOCKERFILE_PATH"
          declarations="$(grep -E '^[[:space:]]*#[[:space:]]*build-platforms:' "$dockerfile" || true)"
          if [[ -z "$declarations" ]]; then
            platforms="linux/amd64"
          else
            declaration_count="$(printf '%s\n' "$declarations" | wc -l | tr -d ' ')"
            if [[ "$declaration_count" != "1" ]]; then
              echo "::error::$dockerfile must contain at most one build-platforms declaration."
              exit 1
            fi

            platforms="${declarations#*:}"
            platforms="${platforms//[[:space:]]/}"
            if [[ -z "$platforms" ]]; then
              echo "::error::The build-platforms declaration in $dockerfile is empty."
              exit 1
            fi

            if [[ ! "$platforms" =~ ^linux/(amd64|arm64)(,linux/(amd64|arm64))*$ ]]; then
              echo "::error::Malformed or unsupported build-platforms declaration in $dockerfile: $platforms. Supported platforms are linux/amd64 and linux/arm64."
              exit 1
            fi

            IFS=',' read -r -a platform_list <<< "$platforms"
            seen_platforms=","
            for platform in "${platform_list[@]}"; do
              if [[ "$seen_platforms" == *",$platform,"* ]]; then
                echo "::error::Duplicate platform '$platform' in $dockerfile."
                exit 1
              fi
              seen_platforms+="$platform,"
            done

            platforms="$(IFS=,; echo "${platform_list[*]}")"
          fi

          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Building $dockerfile for: $platforms"

      - uses: CCBR/actions/build-docker@v0.9.0
        with:
          dockerfile: ${{ matrix.file }}
          dockerhub-namespace: nciccbr
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          dockerhub-token: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          registries: dockerhub,ghcr
          suffix: ${{ steps.build-policy.outputs.suffix }}
          push: ${{ steps.build-policy.outputs.push }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          github-token: ${{ github.token }}
