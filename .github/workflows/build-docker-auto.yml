# This GitHub Actions workflow automatically builds Docker images when Dockerfiles are modified.
#
# Workflow Name: build-docker-auto
# Short Description: Build Docker images for each modified Dockerfile
#
# Triggers:
# - On push events to branches containing "autobuild" in the name, if any Dockerfile.* is modified.
# - On pull request events to 'main' and 'dev' branches, if any Dockerfile.* is modified.
#
# Jobs:
#   1. get-files: Detects changed Dockerfiles using the changed-files action with latest-commit mode.
#      - PRs: latest commit only (fork-safe).
#      - Push: full before...after range.
#   2. build-docker: For each changed Dockerfile, builds and optionally pushes the Docker image using the build-docker action.
#
# Notes:
# - The changed-files action uses comparison-mode: latest-commit to avoid redundant builds when
#   multiple commits in a single PR touch the same Dockerfile.
# - The workflow is fork-safe: both get-files and build-docker steps work on fork pull requests.

name: build-docker-auto

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - "**autobuild**" # Only trigger if the branch name contains "autobuild"
    paths:
      - "**/Dockerfile.*" # Only trigger if a Dockerfile.* is modified in any directory

  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**/Dockerfile.*" # Only trigger if a Dockerfile.* is modified in any directory
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review # Ensures the workflow triggers only when a draft is marked "Ready for Review"

env:
  suffix: ${{ github.base_ref == 'main' && github.event_name == 'pull_request' &&
    'main' || github.base_ref == 'dev' && github.event_name == 'pull_request' &&
    'dev' || 'feat' }}

jobs:
  get-files:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.changed-files.outputs.matched_files_json }}
    steps:
      - id: changed-files
        name: Check changed files
        uses: CCBR/actions/changed-files@main
        with:
          token: ${{ github.token }}
          paths: |
            **/Dockerfile.*
          comparison-mode: event

      - name: Show changed files
        id: matrix
        run: |
          echo "matched files:"
          echo "${{ steps.changed-files.outputs.matched_files }}" | sed 's/^/  /'

  build-docker:
    needs: [ get-files ]
    if: needs.get-files.outputs.json != '[]' # Skip if no Dockerfiles changed in the latest commit
    strategy:
      matrix:
        file: "${{ fromJson(needs.get-files.outputs.json) }}"
      max-parallel: 1
      fail-fast: false
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: CCBR/actions/build-docker@latest
        with:
          dockerfile: ${{ matrix.file }}
          dockerhub-namespace: nciccbr
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          dockerhub-token: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          suffix: ${{ env.suffix }}
          push: true
          github-token: ${{ github.token }}
