# This GitHub Actions workflow automatically builds Docker images when Dockerfiles are modified.
#
# Workflow Name: build-docker-auto
# Short Description: Build Docker images for each modified Dockerfile
#
# Triggers:
# - On pushes to main or branches containing "autobuild" that change a Dockerfile or its source metadata.
# - On pull requests to main that change a Dockerfile or its source metadata.
#
# Jobs:
#   1. get-files: Detects changed Dockerfiles across the event range.
#      - Initial branch pushes use the first pushed commit's parent as the diff base.
#      - Other pushes and pull requests use the changed-files action.
#   2. build-docker: For each changed Dockerfile, builds and optionally pushes the Docker image using the build-docker action.
#
# Notes:
# - Initial pushes have an all-zero `before` SHA, so changed Dockerfiles are collected from git
#   history instead of calling the compare API with an invalid SHA.
# - Fork pull requests build images without publishing them.
# - Dockerfiles can opt into additional architectures with a `# build-platforms:` comment.
# - PR synchronize events only build when the new commit range changes a Dockerfile or its source metadata.
# - New PR builds cancel stale builds for the same Dockerfile; other PRs and pushes are unaffected.

name: build-docker-auto

permissions:
  contents: write
  pull-requests: write
  packages: write

on:
  push:
    branches:
      - main
      - "**autobuild**"
    paths:
      - "**/Dockerfile.*"
      - "**/.Dockerfile.*.source.json"

  pull_request:
    branches:
      - main
    paths:
      - "**/Dockerfile.*"
      - "**/.Dockerfile.*.source.json"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review # Ensures the workflow triggers only when a draft is marked "Ready for Review"

jobs:
  get-files:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.existing-files.outputs.matched_files_json }}
    steps:
      - name: Checkout event source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find Dockerfiles in initial push
        id: initial-push
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        env:
          FIRST_PUSH_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          set -euo pipefail

          if [[ -z "$FIRST_PUSH_COMMIT" ]]; then
            echo "::error::Initial push event did not include any commits."
            exit 1
          fi

          parents="$(git rev-list --parents -n 1 "$FIRST_PUSH_COMMIT")"
          read -r _ base_sha _ <<< "$parents"
          if [[ -n "${base_sha:-}" ]]; then
            changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          else
            changed_files="$(git ls-tree --name-only -r "$GITHUB_SHA")"
          fi

          matched_files_json="$(printf '%s\n' "$changed_files" | python3 -c '
          import json
          import sys

          files = []
          for path in sys.stdin.read().splitlines():
              name = path.rsplit("/", 1)[-1]
              if name.startswith("Dockerfile.") or (
                  name.startswith(".Dockerfile.") and name.endswith(".source.json")
              ):
                  files.append(path)
          print(json.dumps(files))
          ')"

          echo "matched_files_json=$matched_files_json" >> "$GITHUB_OUTPUT"
          echo "Matched Dockerfiles: $matched_files_json"

      - id: synchronize-files
        name: Check Dockerfiles changed in PR update
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" || -z "$AFTER_SHA" || -z "$HEAD_REPOSITORY" ]]; then
            echo "::error::Pull request synchronize event is missing its before/after commit or head repository."
            exit 1
          fi

          changed_files="$(gh api \
            "repos/${HEAD_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
            --jq '.files[]?.filename | select(test("(^|/)\\.?Dockerfile\\."))')"
          matched_files_json="$(printf '%s\n' "$changed_files" | python3 -c '
          import json
          import sys

          files = [path for path in sys.stdin.read().splitlines() if path]
          print(json.dumps(files))
          ')"

          echo "matched_files_json=$matched_files_json" >> "$GITHUB_OUTPUT"
          echo "Dockerfiles changed in PR update: $matched_files_json"

      - id: changed-files
        name: Check changed files
        if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
        uses: CCBR/actions/changed-files@v0.9.1
        with:
          token: ${{ github.token }}
          paths: |
            **/Dockerfile.*
            **/.Dockerfile.*.source.json
          comparison-mode: event

      - name: Select Dockerfiles to build
        id: select-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INITIAL_PUSH_FILES_JSON: ${{ steps.initial-push.outputs.matched_files_json }}
          SYNCHRONIZE_FILES_JSON: ${{ steps.synchronize-files.outputs.matched_files_json }}
          EVENT_FILES_JSON: ${{ steps.changed-files.outputs.matched_files_json }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" &&
                "$EVENT_ACTION" == "synchronize" &&
                "$SYNCHRONIZE_FILES_JSON" == "[]" ]]; then
            selected_files_json="[]"
          else
            selected_files_json="${INITIAL_PUSH_FILES_JSON:-$EVENT_FILES_JSON}"
          fi
          echo "json=$selected_files_json" >> "$GITHUB_OUTPUT"
          echo "Selected Dockerfiles: $selected_files_json"

      - name: Exclude deleted Dockerfiles
        id: existing-files
        env:
          MATCHED_FILES_JSON: ${{ steps.select-files.outputs.json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["MATCHED_FILES_JSON"])
          existing = []
          seen = set()
          for file in files:
              path = Path(file)
              if path.name.startswith(".Dockerfile.") and path.name.endswith(".source.json"):
                  dockerfile = path.with_name(path.name[1:-len(".source.json")])
                  if not path.is_file() and dockerfile.is_file():
                      print(f"::warning::Source metadata was removed: {path}")
              else:
                  dockerfile = path
              name = dockerfile.as_posix()
              if dockerfile.is_file() and name not in seen:
                  existing.append(name)
                  seen.add(name)
              elif not dockerfile.is_file():
                  print(f"::notice::Skipping deleted Dockerfile: {name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matched_files_json={json.dumps(existing)}", file=output)
          PY

  build-docker:
    needs: [get-files]
    if: needs.get-files.outputs.json != '[]' # Skip if no Dockerfiles changed in the event range
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.file }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        file: "${{ fromJson(needs.get-files.outputs.json) }}"
      max-parallel: 8
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        name: Checkout repository
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare checked-out branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: git switch --create "$BRANCH_NAME"

      - name: Determine image publication
        id: build-policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$EVENT_NAME" in
            push)
              push=true
              if [[ "$EVENT_REF" == "refs/heads/main" ]]; then
                suffix=main
              else
                suffix=dev
              fi
              ;;
            pull_request)
              if [[ -z "$PR_HEAD_REPOSITORY" ]]; then
                echo "::error::Pull request head repository is unavailable."
                exit 1
              fi
              suffix=dev
              if [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                push=true
              else
                push=false
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Check workflow checkout location
        if: github.event_name == 'pull_request'
        run: |
          workflow_checkout="$GITHUB_WORKSPACE/.ccbr-workflow-source"
          if [[ -e "$workflow_checkout" || -L "$workflow_checkout" ]]; then
            echo "::error::Reserved workflow checkout path already exists: $workflow_checkout"
            exit 1
          fi

      - name: Checkout workflow action
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ccbr-workflow-source
          sparse-checkout: .github/actions/restore-docker-context
          persist-credentials: false

      - name: Restore source context for pull requests
        if: github.event_name == 'pull_request'
        uses: ./.ccbr-workflow-source/.github/actions/restore-docker-context
        with:
          dockerfile: ${{ matrix.file }}

      - name: Restore source context for pushes
        if: github.event_name == 'push'
        uses: ./.github/actions/restore-docker-context
        with:
          dockerfile: ${{ matrix.file }}

      - name: Move workflow checkout out of the build context
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          helper_dir="$(mktemp -d "$RUNNER_TEMP/ccbr-workflow.XXXXXX")"
          mv "$GITHUB_WORKSPACE/.ccbr-workflow-source" "$helper_dir/checkout"

      - name: Determine Docker build platforms
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DOCKERFILE_PATH: ${{ matrix.file }}
        run: |
          set -euo pipefail
          # Use the workflow revision, even when the Dockerfile comes from an older fork.
          resolver="$RUNNER_TEMP/resolve_docker_platforms.py"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/resolve_docker_platforms.py?ref=$WORKFLOW_SHA" \
            --header "Accept: application/vnd.github.raw+json" > "$resolver"
          python3 "$resolver" "$GITHUB_WORKSPACE/$DOCKERFILE_PATH"

      - uses: CCBR/actions/build-docker@v0.9.1
        with:
          dockerfile: ${{ matrix.file }}
          dockerhub-namespace: nciccbr
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          dockerhub-token: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          registries: dockerhub,ghcr
          suffix: ${{ steps.build-policy.outputs.suffix }}
          push: ${{ steps.build-policy.outputs.push }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          github-token: ${{ github.token }}
