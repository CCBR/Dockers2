name: build-docker-manual

run-name: ${{ inputs.dockerfile }}

on:
  # push:
  #   branches:
  #     - smaller_base_image
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        description: path to the Dockerfile in the repo (e.g. common/ccbr_bwa/Dockerfile)
        required: true
      push:
        type: boolean
        description: Push to DockerHub (leave unchecked to just build the container without pushing)
        required: true

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        if: ${{ github.event.inputs.push == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare build-time variables and set variables
        id: vars
        run: |
          bash scripts/prepare_for_build ${{ github.event.inputs.dockerfile }} 
      - name: check variables and build
        id: check_and_build
        run: |
            echo $DOCKERFILE
            echo $IMAGENAME
            echo $BASEIMAGENAME
            echo $BUILD_DATE
            echo $BUILD_TAG
            echo $REPONAME

