name: build-docker-manual

run-name: ${{ inputs.dockerfile }}

on:
  # push:
  #   branches:
  #     - smaller_base_image
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        description: path to the Dockerfile in the repo (e.g. common/ccbr_bwa/Dockerfile)
        required: true
      push:
        type: boolean
        description: Push to DockerHub (leave unchecked to just build the container without pushing)
        required: true

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        if: ${{ github.event.inputs.push == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get branch name
        id: get_branch
        run: |
          # Determine the branch name
          if [[ "${GITHUB_REF}" == "refs/heads/"* ]]; then
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          elif [[ "${GITHUB_REF}" == "refs/pull/"* ]]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          else
            BRANCH_NAME="${GITHUB_REF}"
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
      - name: Prepare build-time variables and set variables
        id: vars
        run: |
          bash scripts/prepare_for_build ${{ github.event.inputs.dockerfile }} ${{ env.BRANCH_NAME }}
      - name: check variables
        id: check
        run: |
            echo $DOCKERFILE
            echo $IMAGENAME
            echo $BASEIMAGENAME
            echo $BUILD_DATE
            echo $BUILD_TAG
            echo $REPONAME
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          file: ${{ env.DOCKERFILE }}
          push: false
          tags: ${{ env.IMAGENAME }}
          build-args: |
            DOCKERFILE=${{ env.DOCKERFILE }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_TAG=${{ env.BUILD_TAG }}
            REPONAME=${{ env.REPONAME }}
            IMAGENAME=${{ env.IMAGENAME }}
            BASEIMAGENAME=${{ env.BASEIMAGENAME }}
      - name: List Docker images
        run: docker images
