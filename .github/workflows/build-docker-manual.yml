# This GitHub Actions workflow is designed to manually build and optionally push a Docker image to DockerHub.
# 
# Workflow Name: build-docker-manual
# 
# Inputs:
# - dockerfile: Path to the Dockerfile in the repository (e.g., common/ccbr_bwa/Dockerfile). This input is required.
# - dockerhub_namespace: DockerHub namespace or organization name (e.g., nciccbr). This input is required and defaults to 'nciccbr'.
# - push: Boolean flag to determine whether to push the built image to DockerHub. This input is required and defaults to 'false'.
# 
# Jobs:
# - build-docker: This job runs on an Ubuntu latest runner and performs the following steps:
#   - Checks out the repository.
#   - Logs in to DockerHub if the 'push' input is set to 'true'.
#   - Prepares build-time variables by running a custom script.
#   - Checks variables and creates a temporary README file with build details.
#   - Builds and optionally pushes the Docker image using the docker/build-push-action.
#   - Lists Docker images on the runner.
#   - Updates the DockerHub description with the contents of the temporary README file if the image was successfully pushed.

name: build-docker-manual

run-name: ${{ inputs.dockerfile }}-${{ inputs.suffix }}

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        description: path to the Dockerfile in the repo (e.g. common/ccbr_bwa/Dockerfile)
        required: true
      dockerhub_namespace:
        type: string
        description: dockerhub namespace or org name (e.g. nciccbr)
        required: true
        default: nciccbr
      suffix:
        type: string
        description: Suffix to add to image tag eg. "dev" to add "-dev"
        required: true
        default: feat
      push:
        type: boolean
        description: Push to DockerHub (leave unchecked to just build the container without pushing)
        required: true
        default: false
jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        id: login_dockerhub
        if: ${{ github.event.inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          password: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}

      - name: Prepare build-time variables and set variables
        id: prepare_vars
        run: |
          bash scripts/prepare_for_build ${{ github.event.inputs.dockerfile }} ${{ github.event.inputs.suffix }}

      - name: Check variables and create README
        id: check_and_create_readme
        run: |
            echo "DOCKERFILE: $DOCKERFILE"
            echo "IMAGENAME: $IMAGENAME"
            echo "BASEIMAGENAME: $BASEIMAGENAME"
            echo "BUILD_DATE: $BUILD_DATE"
            echo "BUILD_TAG: $BUILD_TAG"
            echo "REPONAME: $REPONAME"
            echo -ne "## ${{ github.repository }} $IMAGENAME\n\n" > tmp_README.md
            echo "Dockerfile source: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/${{ github.event.inputs.dockerfile }}" >> tmp_README.md
            echo -ne "\n\n" >> tmp_README.md
            echo -ne "Built on: $BUILD_DATE \n\n" >> tmp_README.md
            echo -ne "Build tag: $BUILD_TAG \n\n" >> tmp_README.md 
            echo -ne "Base image: $BASEIMAGENAME \n\n" >> tmp_README.md
            echo -ne "Dockerfile path in repo: $DOCKERFILE \n\n" >> tmp_README.md

      - name: Build and push Docker image
        id: build_and_push
        uses: docker/build-push-action@v5
        with:
          file: ${{ env.DOCKERFILE }}
          push: ${{ github.event.inputs.push }}
          tags: ${{ env.IMAGENAME }}
          build-args: |
            DOCKERFILE=${{ env.DOCKERFILE }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_TAG=${{ env.BUILD_TAG }}
            REPONAME=${{ env.REPONAME }}
            IMAGENAME=${{ env.IMAGENAME }}
            BASEIMAGENAME=${{ env.BASEIMAGENAME }}

      - name: List Docker images
        id: list_docker_images
        run: docker images

      - name: Run print_versions.py inside Docker container
        id: run_script_in_container
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" ${{ env.IMAGENAME }} python3 /ws/scripts/print_versions.py --json /ws/scripts/tool_vrsion_commands.json >> /ws/tmp_README.md
        shell: bash

      - name: Update Docker Hub Description
        id: update_dockerhub_description
        if: ${{ (github.event.inputs.push == 'true') && (steps.build_and_push.outcome == 'success') }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          password: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          repository: ${{ github.event.inputs.dockerhub_namespace }}/${{ env.REPONAME }}
          readme-filepath: tmp_README.md