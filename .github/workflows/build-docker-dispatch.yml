name: build-docker-dispatch

on:
  repository_dispatch:
    types: [ trigger-docker-build ]
  workflow_dispatch:
    inputs:
      owner_repo:
        description: "Name of the repository containing the dockerfile source (OWNER/REPO)"
        required: true
      ref:
        description: "The git ref (branch, tag, or SHA) of the source repo to checkout"
        required: true
        default: main
      dockerfile_path:
        description: "Path to the Dockerfile in the source repository (e.g.
          'path/to/Dockerfile')"
        required: true
        default: Dockerfile
      docker_image_name:
        description: "Name of the docker image to build (e.g. 'bwa', 'mosuite', 'spac')"
        required: true
      docker_image_tag:
        description: "Tag to apply to the built docker image (e.g. 'v0.3.0')"
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  build-docker:
    name: >-
      ${{ github.event_name == 'repository_dispatch'
          && format('{0} | {1}', github.event.client_payload.owner_repo, github.event.client_payload.docker_image_name)
          || format('{0} | {1}', github.event.inputs.owner_repo, github.event.inputs.docker_image_name) }}
    runs-on: ubuntu-latest
    steps:
      - name: process payload
        id: process-payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_OWNER_REPO: ${{ github.event.client_payload.owner_repo }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_DOCKERFILE_PATH: ${{ github.event.client_payload.dockerfile_path }}
          PAYLOAD_IMAGE_NAME: ${{ github.event.client_payload.docker_image_name }}
          PAYLOAD_IMAGE_TAG: ${{ github.event.client_payload.docker_image_tag }}
          INPUT_OWNER_REPO: ${{ github.event.inputs.owner_repo }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_DOCKERFILE_PATH: ${{ github.event.inputs.dockerfile_path }}
          INPUT_IMAGE_NAME: ${{ github.event.inputs.docker_image_name }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.docker_image_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            owner_repo="$PAYLOAD_OWNER_REPO"
            ref="$PAYLOAD_REF"
            dockerfile_path="$PAYLOAD_DOCKERFILE_PATH"
            docker_image_name="$PAYLOAD_IMAGE_NAME"
            docker_image_tag="$PAYLOAD_IMAGE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            owner_repo="$INPUT_OWNER_REPO"
            ref="$INPUT_REF"
            dockerfile_path="$INPUT_DOCKERFILE_PATH"
            docker_image_name="$INPUT_IMAGE_NAME"
            docker_image_tag="$INPUT_IMAGE_TAG"
          else
            echo "::error::Unsupported event: $EVENT_NAME"
            exit 1
          fi

          missing=""
          [[ -n "$owner_repo" ]] || missing+=" owner_repo"
          [[ -n "$ref" ]] || missing+=" ref"
          [[ -n "$dockerfile_path" ]] || missing+=" dockerfile_path"
          [[ -n "$docker_image_name" ]] || missing+=" docker_image_name"
          [[ -n "$docker_image_tag" ]] || missing+=" docker_image_tag"
          if [[ -n "$missing" ]]; then
            echo "::error::Missing required inputs:$missing"
            exit 1
          fi

          if [[ ! "$owner_repo" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::owner_repo must be an OWNER/REPO name."
            exit 1
          fi
          if [[ ! "$docker_image_name" =~ ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$ ]]; then
            echo "::error::docker_image_name must be a lowercase image repository name."
            exit 1
          fi
          if [[ ! "$docker_image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ || ${#docker_image_tag} -gt 128 ]]; then
            echo "::error::docker_image_tag is not a valid Docker tag."
            exit 1
          fi
          if [[ "$ref" == *$'\n'* || "$ref" == *$'\r'* ||
                "$dockerfile_path" == *$'\n'* || "$dockerfile_path" == *$'\r'* ||
                "$dockerfile_path" == /* || "/$dockerfile_path/" == */../* ]]; then
            echo "::error::The ref or Dockerfile path is invalid."
            exit 1
          fi

          repo_name="${owner_repo#*/}"
          context_dir="${repo_name}/${docker_image_name}"
          new_branch="update-${docker_image_name}-${docker_image_tag}"
          if ! git check-ref-format --branch "$new_branch" >/dev/null; then
            echo "::error::The image name and tag do not form a valid branch name."
            exit 1
          fi

          {
            echo "owner_repo=$owner_repo"
            echo "ref=$ref"
            echo "repo_name=$repo_name"
            echo "src_dockerfile_path=$dockerfile_path"
            echo "new_dockerfile_path=$context_dir/Dockerfile.$docker_image_tag"
            echo "docker_image_name=$docker_image_name"
            echo "docker_image_tag=$docker_image_tag"
            echo "context_dir=$context_dir"
            echo "new_branch=$new_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CCBR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CCBR_BOT_PRIVATE_KEY }}
          owner: CCBR
          permission-packages: write
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v6
        name: Checkout Dockers2
        with:
          ref: main
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token }}
      - name: Check source checkout location
        run: |
          source_checkout="$GITHUB_WORKSPACE/.ccbr-dispatch-source"
          if [[ -e "$source_checkout" || -L "$source_checkout" ]]; then
            echo "::error::Reserved source checkout path already exists: $source_checkout"
            exit 1
          fi
      - uses: actions/checkout@v6
        name: Checkout source repository
        with:
          fetch-depth: 0
          repository: ${{ steps.process-payload.outputs.owner_repo }}
          ref: ${{ steps.process-payload.outputs.ref }}
          path: .ccbr-dispatch-source
          persist-credentials: false
      - name: Prepare update branch and Dockerfile
        env:
          BRANCH_NAME: ${{ steps.process-payload.outputs.new_branch }}
          CONTEXT_DIR: ${{ steps.process-payload.outputs.context_dir }}
          NEW_DOCKERFILE_PATH: "${{ steps.process-payload.outputs.new_dockerfile_path }}"
          SRC_DOCKERFILE_PATH: "${{ steps.process-payload.outputs.src_dockerfile_path }}"
        run: |
          set -euo pipefail
          git config --local user.name 'CCBR-bot[bot]'
          git config --local user.email '258092125+CCBR-bot[bot]@users.noreply.github.com'

          remote_branch="$(git ls-remote --heads origin "$BRANCH_NAME")"
          if [[ -n "$remote_branch" ]]; then
            git fetch origin "$BRANCH_NAME:$BRANCH_NAME"
          fi
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            git switch "$BRANCH_NAME"
          else
            git switch -c "$BRANCH_NAME"
          fi

          src="$(python3 - <<'PY'
          import os
          from pathlib import Path
          import sys

          root = Path(".ccbr-dispatch-source").resolve()
          source = (root / os.environ["SRC_DOCKERFILE_PATH"]).resolve()
          if not source.is_relative_to(root) or not source.is_file():
              print("::error::Dockerfile must be a file inside the source repository.", file=sys.stderr)
              raise SystemExit(1)
          print(source)
          PY
          )"
          mkdir -p "$CONTEXT_DIR"
          rsync -a --exclude='.git' .ccbr-dispatch-source/ "$CONTEXT_DIR/"
          cp "$src" "$NEW_DOCKERFILE_PATH"

      - name: Record source context
        id: source-context
        env:
          SOURCE_REPOSITORY: ${{ steps.process-payload.outputs.owner_repo }}
          NEW_DOCKERFILE_PATH: ${{ steps.process-payload.outputs.new_dockerfile_path }}
        run: |
          set -euo pipefail
          export SOURCE_COMMIT
          SOURCE_COMMIT="$(git -C .ccbr-dispatch-source rev-parse --verify HEAD)"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dockerfile = Path(os.environ["NEW_DOCKERFILE_PATH"])
          metadata = dockerfile.with_name(f".{dockerfile.name}.source.json")
          metadata.write_text(
              json.dumps(
                  {"repository": os.environ["SOURCE_REPOSITORY"], "commit": os.environ["SOURCE_COMMIT"]},
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"metadata={metadata.as_posix()}", file=output)
          PY

      - name: Commit new Dockerfile
        env:
          BRANCH_NAME: ${{ steps.process-payload.outputs.new_branch }}
          DOCKER_IMAGE_NAME: ${{ steps.process-payload.outputs.docker_image_name }}
          DOCKER_IMAGE_TAG: ${{ steps.process-payload.outputs.docker_image_tag }}
          NEW_DOCKERFILE_PATH: ${{ steps.process-payload.outputs.new_dockerfile_path }}
          SOURCE_METADATA_PATH: ${{ steps.source-context.outputs.metadata }}
        run: |
          set -euo pipefail
          git add -- "$NEW_DOCKERFILE_PATH" "$SOURCE_METADATA_PATH"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "feat: add Dockerfile for $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
          fi
          git push -u origin "$BRANCH_NAME"
      - uses: CCBR/actions/build-docker@v0.9.0
        id: build-docker
        with:
          dockerfile: ${{ steps.process-payload.outputs.new_dockerfile_path }}
          dockerhub-namespace: nciccbr
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME_VK }}
          dockerhub-token: ${{ secrets.DOCKERHUBRW_TOKEN_VK }}
          registries: dockerhub,ghcr
          github-token: ${{ steps.generate-token.outputs.token }}
          suffix: dev
          push: true

      - name: Open or update PR to main
        env:
          BRANCH_NAME: ${{ steps.process-payload.outputs.new_branch }}
          DOCKER_IMAGE_NAME: ${{ steps.process-payload.outputs.docker_image_name }}
          DOCKER_IMAGE_TAG: ${{ steps.process-payload.outputs.docker_image_tag }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          existing_pr="$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')"

          if [ -n "$existing_pr" ]; then
            if ! gh pr edit "$existing_pr" --add-reviewer CCBR/AdminTeam; then
              echo "::warning::Could not add CCBR/AdminTeam as a reviewer to PR #$existing_pr."
            fi
          else
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "feat: add/update Dockerfile for ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}" \
              --body "Adds Dockerfile and generated image metadata updates for ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}." \
              --reviewer CCBR/AdminTeam
          fi
