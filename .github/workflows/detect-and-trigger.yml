# This GitHub Actions workflow is designed to trigger a manual Docker build for each modified Dockerfile.
# 
# Workflow Name: detect-and-trigger
# Short Description: Trigger Build Docker Manual for Each modified Dockerfile
#
# Triggers:
# - On push events to any branch except 'main' and 'dev', if any Dockerfile.* is modified.
# - On pull request events to 'main' and 'dev' branches, if any Dockerfile.* is modified.
#
# Jobs:
# - detect-and-trigger:
#   - Runs on the latest Ubuntu environment.
#   - Steps:
#     1. Check out the repository using actions/checkout@v4.
#     2. Identify modified Dockerfiles using git diff and store them in the environment variable 'dockerfiles'.
#     3. For each modified Dockerfile, trigger the 'build-docker-manual' workflow with the Dockerfile path and additional parameters.
#
# Environment Variables:
# - GITHUB_TOKEN: Used for authentication to trigger the 'build-docker-manual' workflow.
name: detect-and-trigger

on:
  push:
    branches:
      - '**autobuild**'  # Only trigger if the branch name contains "autobuild"
    paths:
      - '**/Dockerfile.*'  # Only trigger if a Dockerfile.* is modified in any directory

  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**/Dockerfile.*'  # Only trigger if a Dockerfile.* is modified in any directory

jobs:
  detect-and-trigger:
    runs-on: ubuntu-latest

    # Define environment variables
    env:
      SUFFIX: ${{ github.base_ref == 'main' && github.event_name == 'pull_request' && 'main' || github.base_ref == 'dev' && github.event_name == 'pull_request' && 'dev' || 'feat' }}


    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - id: changed-files
        name: Check changed files
        uses: knu/changed-files@v1
        with:
          paths: |
            **/Dockerfile.*

      - name: Show changed files
        id: print-changed-files
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.changed_files }}" | sed 's/^/  /'
          echo "Matched files:"
          echo "${{ steps.changed-files.outputs.matched_files }}" | sed 's/^/  /'

      - name: Trigger build-docker-manual for each modified Dockerfile
        id: trigger-builds
        run: |
          if [ -z "$dockerfiles" ]; then
            echo "No modified Dockerfiles found."
            exit 0
          fi

          WORKFLOW_IDS=()
          for DOCKERFILE in $dockerfiles; do
            echo "Triggering build-docker-manual for $DOCKERFILE"
            gh workflow run build-docker-manual.yml \
              --ref $GITHUB_REF_NAME \
              --field dockerfile=$DOCKERFILE \
              --field dockerhub_namespace=nciccbr \
              --field suffix=${{ env.SUFFIX }} \
              --field push=true

            # Wait for 5 seconds to ensure the workflow run is initiated
            sleep 5

            # Get the most recent workflow run ID
            RUN_ID=$(gh run list --workflow=build-docker-manual.yml --branch=$GITHUB_REF_NAME --limit=1 --json databaseId -q '.[0].databaseId')
            WORKFLOW_IDS+=($RUN_ID)
          done
          
          echo "workflow_ids=${WORKFLOW_IDS[*]}" >> $GITHUB_ENV

      - name: Wait for all build-docker-manual workflows to complete
        id: monitor-runs
        run: |
          STATUS=0
          for RUN_ID in ${WORKFLOW_IDS[@]}; do
            echo "Waiting for build-docker-manual with RUN_ID: $RUN_ID to complete..."
            while true; do
              RUN_STATUS=$(gh run view $RUN_ID --json conclusion -q .conclusion 2>/dev/null || echo "in_progress")

              if [[ "$RUN_STATUS" == "success" ]]; then
                echo "Workflow $RUN_ID completed successfully."
                break
              elif [[ "$RUN_STATUS" == "failure" || "$RUN_STATUS" == "cancelled" ]]; then
                echo "Workflow $RUN_ID failed."
                STATUS=1
                break
              else
                echo "Workflow $RUN_ID still in progress..."
                sleep 10
              fi
            done

            if [[ $STATUS -ne 0 ]]; then
              echo "One or more workflows failed."
              exit 1
            fi
          done
          
          echo "All workflows completed successfully."
          exit 0
